    <style>
        /* 1. Global Resets and Box Sizing Fix */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body,
        html {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background-image: url('bp1.jfif');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: Arial, sans-serif;
        }
        
        .h1 {
            text-align: center;
            position: relative;
            padding: 0;
            margin-left: 90px;
            box-sizing: border-box;
        }
        
        .h1 nav,
        .nav {
            width: 100%;
        }
        /* Navigation Bar Styles */
        
        nav ul {
            display: flex;
            list-style-type: none;
            gap: 20px;
            padding: 20px 40px;
            background-color: white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        nav ul li a {
            text-decoration: none;
            color: black;
            font-weight: bold;
        }
        /* Main Content Section */
        
        .main-content {
            text-align: left;
            margin-top: 70px;
            margin-left: 40px;
        }
        
        .main-content h1 {

            margin-bottom: 20px;
        }
        
        .main-content p {
            color: rgb(14, 4, 4);
            margin-top: 30px;
            font-size: 20px;
        }
        /* Button Styles */
        
        .btn-container {
            margin-left: 37px;
            margin-top: 20px;
        }
        
        .custom-btn {
            background: linear-gradient(135deg, #007BFF, #00BFFF);
            border: none;
            border-radius: 20px;
            padding: 15px 25px;
            font-size: 16px;
            cursor: pointer;
            margin-right: 15px;
            transition: background 0.3s ease;
        }
        
        .custom-btn a {
            text-decoration: none;
            color: white;
            font-weight: bold;
        }
        
        .custom-btn:hover {
            background: linear-gradient(135deg, #0056b3, #0099cc);
        }
    </style>
</head>
